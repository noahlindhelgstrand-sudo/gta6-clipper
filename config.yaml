# gta6-clipper – all icke-hemlig konfiguration.
# Hemligheter läses ENDAST från miljövariabler (se .env.example).
# Alla värden kan överskridas med miljövariabler: CLIPPER__<SEKTION>__<NYCKEL>,
# t.ex. CLIPPER__PUBLISH__PRIVACY_STATUS=public

timezone: Europe/Stockholm
language: en                     # språk för titel/beskrivning/hook (en|sv)

sources:
  twitch:
    enabled: true
    game_name: "Grand Theft Auto VI"
    clip_languages: ["en"]       # tom lista = alla språk
  kick:
    # Kick saknar officiellt clip-API; vi använder den publika webbendpointen.
    # Den kan blockeras (Cloudflare) från GitHub-runners – då loggas en varning
    # och Twitch används ensamt.
    enabled: true
    category_slug: "grand-theft-auto-vi"

selection:
  lookback_hours: 24
  min_views: 200
  min_duration_s: 15
  max_duration_s: 60
  max_candidates_per_run: 3      # hur många nya klipp som laddas ner/renderas per prepare-körning
  max_per_streamer_per_day: 1    # variation: inte bara samma streamer hela dagen
  spoken_languages: ["en"]       # Whisper kontrollerar talat språk; andra språk hoppas över

streamers:
  # policy:
  #   "auto"      – streamers upptäcks automatiskt: de med flest klippvisningar i
  #                 kategorin senaste discovery_days väljs (top_n per plattform).
  #                 Att klipp finns betyder att streamern har clipping påslaget.
  #   "allowlist" – ENDAST streamers i allowlist nedan.
  policy: auto
  discovery_days: 7
  top_n: 25
  # Manuell allowlist – alltid tillåtna. Format "plattform:login".
  allowlist: []
  # Blocklist vinner alltid. Lägg till här om någon ber dig sluta (DMCA, mejl, etc.).
  blocklist: []
  # Facecam-position i källvideon som andelar (0–1) av bredd/höjd.
  # Saknas streamern här renderas layouten utan facecam.
  facecam: {}
    # "twitch:exempelstreamer": {x: 0.0, y: 0.0, w: 0.25, h: 0.28}

render:
  width: 1080
  height: 1920
  max_duration_s: 45
  fps: 30
  crf: 26
  preset: veryfast
  audio_bitrate: 128k
  hook_intro_s: 0.5              # fryst första bildruta med hook-text
  hook_overlay_s: 3.0            # hook-text ligger kvar överst så här länge
  font: "DejaVu Sans"
  censor_profanity: true         # svordomar i undertexter/titlar blir f***

transcribe:
  model: base                    # base | small
  compute_type: int8
  device: cpu

metadata:
  model: claude-opus-5-5         # bara om ANTHROPIC_API_KEY finns (valfritt, kostar pengar)
  effort: low
  max_title_chars: 70
  local_ai: true                 # gratis: CLIP + Qwen körs på GitHub-runnern om ingen nyckel finns
  local_llm: "Qwen/Qwen2.5-1.5B-Instruct"
  local_clip: "openai/clip-vit-base-patch32"
  suggestive_threshold: 0.55     # kalibrerat på riktiga klipp (smoke-ai)

queue:
  buffer_min: 6                  # varning till Discord under detta
  buffer_target: 8               # prepare gör ingenting om bufferten är full
  max_age_hours: 72              # renderade klipp äldre än så kasseras (inaktuella)
  max_suggestive_in_queue: 1     # strippklubb/nakenhet o.d.: högst 1 i kön åt gången

schedule:
  slots: ["12:00", "17:00", "20:30"]   # lokal tid (timezone ovan)
  grace_hours: 3                       # missad slot postas inom detta fönster, annars hoppas den över

publish:
  platforms: [youtube]
  privacy_status: private        # private tills YouTube API Compliance Audit är godkänd
  category_id: "20"              # Gaming
  made_for_kids: false
  max_retries: 5
  max_suggestive_per_day: 1      # högst 1 suggestivt klipp per dag; övriga uppladdningar är annat

storage:
  backend: github_release        # github_release | local
  release_tag: state
  local_dir: data

# Betalda clipping-kampanjer (t.ex. contentrewards.com). Klipp från dessa streamers prioriteras
# (boost x rankning) och får kampanjens hashtags/omnämnande. Gå med i kampanjen på plattformen och
# fyll i kampanjens regler här (hashtags/mention). Sätt active: false när kampanjen är slut.
campaigns:
  - name: "Dasgasd3m x RUCKUS – $2/1K views (Content Rewards)"
    # Betalar per 1 000 visningar på TikTok OCH YouTube (min $10, max $150 per klipp). Deadline 19 dec 2026.
    # Kanalen är okänd (Twitch eller Kick) – båda kontrolleras.
    streamers: ["twitch:dasgasd3m", "kick:dasgasd3m"]
    url: "https://contentrewards.com/c/campaigns/051002dd-5c46-43d0-a446-43f2957ba3a9"
    hashtags: []          # se "Full campaign brief" på kampanjsidan
    mention: ""
    boost: 6.0            # betalar från första visningen – högst prioritet
    min_views: 10
  - name: "Kai Cenat – $10K GTA 6 Pool (Content Rewards)"
    streamers: ["twitch:kaicenat"]
    url: "https://contentrewards.com/c/campaigns/1d2bcb00-c904-415f-aa82-f95b96baad86"
    hashtags: []          # fyll i från kampanjens regler
    mention: ""
    boost: 4.0            # du har gått med här – högst prioritet
  - name: "Lacy – $12,500 GTA VI Marathon Pool (Content Rewards)"
    streamers: ["twitch:lacy"]
    url: "https://contentrewards.com/c/campaigns/a5c63fad-cd53-4b81-9305-4a2d1696872a"
    hashtags: []          # regler: reachclipping.com (LACYGT...) – fyll i
    mention: ""
    boost: 4.0
  - name: "Clix GTA 6 (Content Rewards)"
    streamers: ["twitch:clix"]
    url: "https://contentrewards.com"
    hashtags: []
    mention: ""
    boost: 3.0
    active: false

notify:
  daily_summary: true
