name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Systempaket
        timeout-minutes: 8
        run: |
          # man-db-triggern kan hänga i många minuter på GitHub-runners – stäng av den
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y -qq --no-install-recommends ffmpeg fonts-dejavu-core fonts-montserrat
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Dry-run end-to-end (mockade API:er)
        run: clipper demo --days 1
