name: publish
on:
  schedule:
    # Varje timme (UTC). Koden räknar om till Europe/Stockholm och postar bara
    # när en slot har passerat och inte redan använts – sommar-/vintertid hanteras i koden.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (logga istället för att ladda upp)"
        type: boolean
        default: false
      resume:
        description: "Återuppta uppladdningar efter automatisk paus (copyright-skydd)"
        type: boolean
        default: false
      unblock:
        description: "Avblockera streamer, t.ex. twitch:xqc (lämna tomt annars)"
        type: string
        default: ""

concurrency:
  group: clipper-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Publish
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UNBLOCK: ${{ inputs.unblock }}
        run: |
          if [ "${{ inputs.resume }}" = "true" ]; then clipper resume; fi
          if [ -n "$UNBLOCK" ]; then clipper unblock "$UNBLOCK"; fi
          clipper ${{ inputs.dry_run && '--dry-run' || '' }} publish
