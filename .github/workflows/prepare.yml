name: prepare
on:
  schedule:
    - cron: "17 * * * *"      # varje timme (UTC). Off-the-hour = mindre fördröjning hos GitHub.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run (rendera, men rör inte riktiga tillståndet)"
        type: boolean
        default: false

# Samma grupp som publish => jobben körs aldrig samtidigt och skriver aldrig över varandras databas.
concurrency:
  group: clipper-state
  cancel-in-progress: false

permissions:
  contents: write              # krävs för att läsa/skriva release-assets (state)

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Systempaket
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - name: Cache Whisper-modell
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ hashFiles('config.yaml') }}
          restore-keys: whisper-
      - run: pip install -e .
      - name: Prepare
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: clipper ${{ inputs.dry_run && '--dry-run' || '' }} prepare
