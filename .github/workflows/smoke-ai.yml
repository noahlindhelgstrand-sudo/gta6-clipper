name: smoke-ai
# Testkör den gratis lokala AI:n (Whisper + CLIP + Qwen) på videorna i kön och sparar
# resultatet som release-asset "smoke-ai/smoke.json" (läsbart utan inloggning).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/clipper/localai.py", "src/clipper/metadata.py", ".github/workflows/smoke-ai.yml"]

concurrency:
  group: smoke-ai
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Systempaket
        timeout-minutes: 8
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y -qq --no-install-recommends ffmpeg
      - name: Cache AI-modeller
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('config.yaml') }}
          restore-keys: |
            hf-
            whisper-
      - name: Installera
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[local-ai]"
      - name: Hämta videor ur kön
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p smoke && cd smoke
          gh release download state --pattern '*.mp4' --pattern 'state-*.db' --clobber || true
          ls -la
      - name: Kör lokal AI
        run: |
          cd smoke
          DB=$(ls state-*.db 2>/dev/null | tail -1)
          VIDS=$(ls *.mp4 | head -4)
          python -m clipper.localai ${DB:+--db "$DB"} $VIDS > smoke.json
          cat smoke.json
      - name: Spara resultat
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view smoke-ai >/dev/null 2>&1 || gh release create smoke-ai --prerelease --title "AI smoke test" --notes "Automatiskt testresultat"
          [ -s smoke/smoke.json ] || echo '{"error":"ingen output – se loggen"}' > smoke/smoke.json
          gh release upload smoke-ai smoke/smoke.json --clobber
