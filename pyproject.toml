[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gta6-clipper"
version = "0.1.0"
description = "Automatiska GTA 6-Shorts från Twitch/Kick-klipp till YouTube"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "PyYAML>=6",
  "requests>=2.31",
  "yt-dlp>=2025.1.1",
  "faster-whisper>=1.1",
  "anthropic>=2.10",
  "google-api-python-client>=2.130",
  "google-auth>=2.30",
  "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Gratis lokal AI. Installera torch från CPU-indexet först (mindre):
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
local-ai = ["torch", "transformers>=4.45", "pillow"]

[project.scripts]
clipper = "clipper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
